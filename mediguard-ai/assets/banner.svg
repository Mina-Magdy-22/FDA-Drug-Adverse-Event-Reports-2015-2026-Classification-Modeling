<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" role="img" aria-label="MediGuard AI banner">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a0f1e"/><stop offset="1" stop-color="#12203f"/></linearGradient>
<linearGradient id="ac" x1="0" x2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
<style>
.ecg{stroke-dasharray:1600;stroke-dashoffset:1600;animation:draw 4.5s linear infinite}
@keyframes draw{0%{stroke-dashoffset:1600;opacity:1}70%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.ring{transform-box:fill-box;transform-origin:center;animation:ring 3s ease-out infinite}
.r2{animation-delay:1s}.r3{animation-delay:2s}
@keyframes ring{0%{transform:scale(.7);opacity:.55}100%{transform:scale(1.9);opacity:0}}
.float{animation:float 4s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.fade{opacity:0;animation:fade 1.2s ease forwards}
@keyframes fade{to{opacity:1}}
.blink{animation:blink 1.6s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:.35}50%{opacity:1}}
</style>
</defs>
<rect width="1000" height="300" rx="18" fill="url(#bg)"/>
<g opacity=".06" stroke="#fff"><line x1="50" y1="0" x2="50" y2="300"/><line x1="100" y1="0" x2="100" y2="300"/><line x1="150" y1="0" x2="150" y2="300"/><line x1="200" y1="0" x2="200" y2="300"/><line x1="250" y1="0" x2="250" y2="300"/><line x1="300" y1="0" x2="300" y2="300"/><line x1="350" y1="0" x2="350" y2="300"/><line x1="400" y1="0" x2="400" y2="300"/><line x1="450" y1="0" x2="450" y2="300"/><line x1="500" y1="0" x2="500" y2="300"/><line x1="550" y1="0" x2="550" y2="300"/><line x1="600" y1="0" x2="600" y2="300"/><line x1="650" y1="0" x2="650" y2="300"/><line x1="700" y1="0" x2="700" y2="300"/><line x1="750" y1="0" x2="750" y2="300"/><line x1="800" y1="0" x2="800" y2="300"/><line x1="850" y1="0" x2="850" y2="300"/><line x1="900" y1="0" x2="900" y2="300"/><line x1="950" y1="0" x2="950" y2="300"/><line x1="0" y1="50" x2="1000" y2="50"/><line x1="0" y1="100" x2="1000" y2="100"/><line x1="0" y1="150" x2="1000" y2="150"/><line x1="0" y1="200" x2="1000" y2="200"/><line x1="0" y1="250" x2="1000" y2="250"/></g>
<path d="M0,238 H60 l12,0 l8,-14 l10,14 l10,0 l8,-52 l14,86 l10,-48 l8,14 l10,0 l8,-10 l12,10 H230 l12,0 l8,-14 l10,14 l10,0 l8,-52 l14,86 l10,-48 l8,14 l10,0 l8,-10 l12,10 H400 l12,0 l8,-14 l10,14 l10,0 l8,-52 l14,86 l10,-48 l8,14 l10,0 l8,-10 l12,10 H570 l12,0 l8,-14 l10,14 l10,0 l8,-52 l14,86 l10,-48 l8,14 l10,0 l8,-10 l12,10 H740 l12,0 l8,-14 l10,14 l10,0 l8,-52 l14,86 l10,-48 l8,14 l10,0 l8,-10 l12,10 H910 l12,0 l8,-14 l10,14 l10,0 l8,-52 l14,86 l10,-48 l8,14 l10,0 l8,-10 l12,10 H1000" fill="none" stroke="#2dd4bf" stroke-opacity=".18" stroke-width="2"/>
<path class="ecg" d="M0,238 H60 l12,0 l8,-14 l10,14 l10,0 l8,-52 l14,86 l10,-48 l8,14 l10,0 l8,-10 l12,10 H230 l12,0 l8,-14 l10,14 l10,0 l8,-52 l14,86 l10,-48 l8,14 l10,0 l8,-10 l12,10 H400 l12,0 l8,-14 l10,14 l10,0 l8,-52 l14,86 l10,-48 l8,14 l10,0 l8,-10 l12,10 H570 l12,0 l8,-14 l10,14 l10,0 l8,-52 l14,86 l10,-48 l8,14 l10,0 l8,-10 l12,10 H740 l12,0 l8,-14 l10,14 l10,0 l8,-52 l14,86 l10,-48 l8,14 l10,0 l8,-10 l12,10 H910 l12,0 l8,-14 l10,14 l10,0 l8,-52 l14,86 l10,-48 l8,14 l10,0 l8,-10 l12,10 H1000" fill="none" stroke="url(#ac)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(135,118)">
<circle class="ring" r="48" fill="none" stroke="#3b82f6" stroke-width="2"/>
<circle class="ring r2" r="48" fill="none" stroke="#3b82f6" stroke-width="2"/>
<circle class="ring r3" r="48" fill="none" stroke="#2dd4bf" stroke-width="2"/>
<g class="float">
<path d="M0,-50 L42,-33 V6 C42,34 19,51 0,60 C-19,51 -42,34 -42,6 V-33 Z" fill="url(#ac)"/>
<path d="M0,-40 L33,-27 V5 C33,27 15,41 0,48 C-15,41 -33,27 -33,5 V-27 Z" fill="#0a0f1e" fill-opacity=".35"/>
<rect x="-6" y="-20" width="12" height="40" rx="3" fill="#fff"/><rect x="-20" y="-6" width="40" height="12" rx="3" fill="#fff"/>
</g></g>
<g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<text class="fade" x="230" y="112" font-size="62" font-weight="800" fill="url(#ac)" letter-spacing="-2">MediGuard AI</text>
<text class="fade" style="animation-delay:.4s" x="232" y="152" font-size="19" fill="#9fb3d1">Predicting fatal drug adverse events from 528,000 FDA FAERS reports</text>
<g class="fade" style="animation-delay:.8s" font-size="13" font-weight="700" letter-spacing="1">
<rect x="232" y="170" width="170" height="28" rx="14" fill="#3b82f6" fill-opacity=".18"/><text x="317" y="189" text-anchor="middle" fill="#60a5fa">PHARMACOVIGILANCE</text>
<rect x="412" y="170" width="150" height="28" rx="14" fill="#2dd4bf" fill-opacity=".18"/><text x="487" y="189" text-anchor="middle" fill="#2dd4bf">MACHINE LEARNING</text>
<rect x="572" y="170" width="160" height="28" rx="14" fill="#c084fc" fill-opacity=".18"/><text x="652" y="189" text-anchor="middle" fill="#c084fc">LEAKAGE-FREE</text>
</g>
<g class="blink" font-size="12" fill="#ef4444" font-weight="700"><circle cx="838" cy="48" r="5"/><text x="850" y="52">LIVE RISK MONITORING</text></g>
</g>
</svg>