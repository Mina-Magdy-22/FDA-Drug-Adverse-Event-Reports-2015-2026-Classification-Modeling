<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 230" width="100%" role="img" aria-label="MediGuard ML pipeline">
<defs><linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#3b82f6"/><stop offset="1" stop-color="#2dd4bf"/></linearGradient>
<style>
.node{animation:glow 5.6s ease-in-out infinite}
@keyframes glow{0%{stroke:#2c4a7a;fill:#0f1a30}6%{stroke:#2dd4bf;fill:#134e4a}16%{stroke:#2c4a7a;fill:#0f1a30}100%{stroke:#2c4a7a;fill:#0f1a30}}
.dash{stroke-dasharray:8 8;animation:flow 1s linear infinite}
@keyframes flow{to{stroke-dashoffset:-16}}
</style></defs>
<rect width="1000" height="230" rx="16" fill="#0a0f1e"/>
<line x1="80" y1="95" x2="920" y2="95" stroke="#1e2b3f" stroke-width="4"/>
<line class="dash" x1="80" y1="95" x2="920" y2="95" stroke="url(#ln)" stroke-width="2.5"/>
<g font-family="'Segoe UI',Helvetica,Arial,sans-serif"><g><circle class="node" style="animation-delay:0s" cx="80" cy="95" r="26" fill="#0f1a30" stroke="#2c4a7a" stroke-width="2.5"/>
<text x="80" y="101" text-anchor="middle" font-size="17" font-weight="800" fill="#e8edf5">1</text>
<text x="80" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#e8edf5">EDA</text>
<text x="80" y="165" text-anchor="middle" font-size="12" fill="#7f93b3">14 analysis steps</text></g>
<g><circle class="node" style="animation-delay:0.6s" cx="200" cy="95" r="26" fill="#0f1a30" stroke="#2c4a7a" stroke-width="2.5"/>
<text x="200" y="101" text-anchor="middle" font-size="17" font-weight="800" fill="#e8edf5">2</text>
<text x="200" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#e8edf5">Leakage &amp;</text>
<text x="200" y="165" text-anchor="middle" font-size="12" fill="#7f93b3">Cleaning</text></g>
<g><circle class="node" style="animation-delay:1.3s" cx="320" cy="95" r="26" fill="#0f1a30" stroke="#2c4a7a" stroke-width="2.5"/>
<text x="320" y="101" text-anchor="middle" font-size="17" font-weight="800" fill="#e8edf5">3</text>
<text x="320" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#e8edf5">Feature</text>
<text x="320" y="165" text-anchor="middle" font-size="12" fill="#7f93b3">Engineering</text></g>
<g><circle class="node" style="animation-delay:2.0s" cx="440" cy="95" r="26" fill="#0f1a30" stroke="#2c4a7a" stroke-width="2.5"/>
<text x="440" y="101" text-anchor="middle" font-size="17" font-weight="800" fill="#e8edf5">4</text>
<text x="440" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#e8edf5">Encoding</text>
<text x="440" y="165" text-anchor="middle" font-size="12" fill="#7f93b3">ordinal / freq.</text></g>
<g><circle class="node" style="animation-delay:2.7s" cx="560" cy="95" r="26" fill="#0f1a30" stroke="#2c4a7a" stroke-width="2.5"/>
<text x="560" y="101" text-anchor="middle" font-size="17" font-weight="800" fill="#e8edf5">5</text>
<text x="560" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#e8edf5">Split</text>
<text x="560" y="165" text-anchor="middle" font-size="12" fill="#7f93b3">80/20 stratified</text></g>
<g><circle class="node" style="animation-delay:3.4s" cx="680" cy="95" r="26" fill="#0f1a30" stroke="#2c4a7a" stroke-width="2.5"/>
<text x="680" y="101" text-anchor="middle" font-size="17" font-weight="800" fill="#e8edf5">6</text>
<text x="680" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#e8edf5">Scaling</text>
<text x="680" y="165" text-anchor="middle" font-size="12" fill="#7f93b3">train-fit only</text></g>
<g><circle class="node" style="animation-delay:4.1s" cx="800" cy="95" r="26" fill="#0f1a30" stroke="#2c4a7a" stroke-width="2.5"/>
<text x="800" y="101" text-anchor="middle" font-size="17" font-weight="800" fill="#e8edf5">7</text>
<text x="800" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#e8edf5">SMOTE</text>
<text x="800" y="165" text-anchor="middle" font-size="12" fill="#7f93b3">train set only</text></g>
<g><circle class="node" style="animation-delay:4.8s" cx="920" cy="95" r="26" fill="#0f1a30" stroke="#2c4a7a" stroke-width="2.5"/>
<text x="920" y="101" text-anchor="middle" font-size="17" font-weight="800" fill="#e8edf5">8</text>
<text x="920" y="147" text-anchor="middle" font-size="14" font-weight="700" fill="#e8edf5">Select &amp;</text>
<text x="920" y="165" text-anchor="middle" font-size="12" fill="#7f93b3">Model</text></g>
</g>
<circle r="7" fill="#2dd4bf"><animateMotion dur="5.6s" repeatCount="indefinite" path="M80,95 H920"/></circle>
<circle r="14" fill="#2dd4bf" opacity=".25"><animateMotion dur="5.6s" repeatCount="indefinite" path="M80,95 H920"/></circle>
<text x="500" y="205" text-anchor="middle" font-size="13" fill="#5d7090" font-family="'Segoe UI',Helvetica,Arial,sans-serif">Test set stays untouched at the real-world 10.3% fatal rate  ·  Scaler, SMOTE and selector are fitted on training data only</text>
</svg>