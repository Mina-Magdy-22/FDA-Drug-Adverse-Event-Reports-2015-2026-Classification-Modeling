<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" role="img" aria-label="ROC-AUC by model">
<defs><style>
.bar{transform-box:fill-box;transform-origin:left center;animation:grow 7s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes grow{0%{transform:scaleX(0);opacity:1}16%{transform:scaleX(1)}90%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.val{opacity:0;animation:val 7s ease infinite}
@keyframes val{0%,10%{opacity:0}20%{opacity:1}90%{opacity:1}100%{opacity:0}}
.star{animation:pulse 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
</style></defs>
<rect width="1000" height="340" rx="16" fill="#0a0f1e"/>
<g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<text x="40" y="42" font-size="20" font-weight="800" fill="#e8edf5">ROC-AUC on the real-distribution test set</text>
<text x="40" y="62" font-size="13" fill="#6b7f9f">105,600 held-out reports · 10.3% fatal · higher is better</text>
<text x="40" y="100" font-size="15" font-weight="600" fill="#c9d3e8">Random Forest</text>
<rect x="230" y="80" width="560" height="28" rx="6" fill="#121b2e"/>
<rect class="bar" style="animation-delay:0.0s" x="230" y="80" width="471" height="28" rx="6" fill="#4ade80"/>
<text class="val" style="animation-delay:0.9s" x="711" y="100" font-size="15" font-weight="800" fill="#4ade80">0.8414</text>
<text x="40" y="148" font-size="15" font-weight="600" fill="#c9d3e8">XGBoost</text>
<rect x="230" y="128" width="560" height="28" rx="6" fill="#121b2e"/>
<rect class="bar" style="animation-delay:0.25s" x="230" y="128" width="469" height="28" rx="6" fill="#3b82f6"/>
<text class="val" style="animation-delay:1.15s" x="709" y="148" font-size="15" font-weight="800" fill="#3b82f6">0.8380</text>
<text x="40" y="196" font-size="15" font-weight="600" fill="#c9d3e8">LightGBM</text>
<rect x="230" y="176" width="560" height="28" rx="6" fill="#121b2e"/>
<rect class="bar" style="animation-delay:0.5s" x="230" y="176" width="460" height="28" rx="6" fill="#c084fc"/>
<text class="val" style="animation-delay:1.4s" x="700" y="196" font-size="15" font-weight="800" fill="#c084fc">0.8212</text>
<text x="40" y="244" font-size="15" font-weight="600" fill="#c9d3e8">Decision Tree</text>
<rect x="230" y="224" width="560" height="28" rx="6" fill="#121b2e"/>
<rect class="bar" style="animation-delay:0.75s" x="230" y="224" width="431" height="28" rx="6" fill="#f59e0b"/>
<text class="val" style="animation-delay:1.65s" x="671" y="244" font-size="15" font-weight="800" fill="#f59e0b">0.7703</text>
<text x="40" y="292" font-size="15" font-weight="600" fill="#c9d3e8">Logistic Regression</text>
<rect x="230" y="272" width="560" height="28" rx="6" fill="#121b2e"/>
<rect class="bar" style="animation-delay:1.0s" x="230" y="272" width="379" height="28" rx="6" fill="#94a3b8"/>
<text class="val" style="animation-delay:1.9s" x="619" y="292" font-size="15" font-weight="800" fill="#94a3b8">0.6764</text>

<g class="star"><rect x="856" y="78" width="104" height="30" rx="15" fill="#4ade80" fill-opacity=".16"/><text x="908" y="98" text-anchor="middle" font-size="12" font-weight="800" fill="#4ade80" letter-spacing="1">★ BEST MODEL</text></g>
<text x="230" y="326" font-size="12" fill="#4a5d7c">0.0</text><text x="780" y="326" font-size="12" fill="#4a5d7c">1.0</text>
</g></svg>