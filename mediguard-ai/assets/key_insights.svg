<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 310" width="100%" role="img" aria-label="Key data insights">
<defs><style>
.col{transform-box:fill-box;transform-origin:center bottom;animation:up 7s cubic-bezier(.2,.8,.2,1) infinite}
@keyframes up{0%{transform:scaleY(0);opacity:1}15%{transform:scaleY(1)}90%{transform:scaleY(1);opacity:1}100%{transform:scaleY(1);opacity:0}}
.lab{opacity:0;animation:lab 7s ease infinite}
@keyframes lab{0%,10%{opacity:0}20%{opacity:1}90%{opacity:1}100%{opacity:0}}
</style></defs>
<rect width="1000" height="310" rx="16" fill="#0a0f1e"/>
<g font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<g transform="translate(30,0)">
<text x="150" y="48" text-anchor="middle" font-size="16" font-weight="800" fill="#e8edf5">Elderly + polypharmacy</text>
<text x="150" y="68" text-anchor="middle" font-size="12" fill="#6b7f9f">Fatal rate (age 66+ and 6+ drugs)</text>
<line x1="40" y1="250" x2="260" y2="250" stroke="#1e2b3f" stroke-width="2"/>
<rect class="col" style="animation-delay:0.0s" x="75" y="181" width="62" height="69" rx="6" fill="#2c3e5c"/>
<rect class="col" style="animation-delay:0.25s" x="165" y="113" width="62" height="137" rx="6" fill="#ef4444"/>
<text class="lab" style="animation-delay:1.0s" x="106" y="173" text-anchor="middle" font-size="15" font-weight="800" fill="#c9d3e8">9.20%</text>
<text class="lab" style="animation-delay:1.2s" x="196" y="105" text-anchor="middle" font-size="15" font-weight="800" fill="#ef4444">18.27%</text>
</g>
<g transform="translate(350,0)">
<text x="150" y="48" text-anchor="middle" font-size="16" font-weight="800" fill="#e8edf5">COVID-19 year</text>
<text x="150" y="68" text-anchor="middle" font-size="12" fill="#6b7f9f">Fatal rate: other years vs 2020</text>
<line x1="40" y1="250" x2="260" y2="250" stroke="#1e2b3f" stroke-width="2"/>
<rect class="col" style="animation-delay:0.3s" x="75" y="178" width="62" height="72" rx="6" fill="#2c3e5c"/>
<rect class="col" style="animation-delay:0.55s" x="165" y="117" width="62" height="133" rx="6" fill="#f59e0b"/>
<text class="lab" style="animation-delay:1.3s" x="106" y="170" text-anchor="middle" font-size="15" font-weight="800" fill="#c9d3e8">9.54%</text>
<text class="lab" style="animation-delay:1.5s" x="196" y="109" text-anchor="middle" font-size="15" font-weight="800" fill="#f59e0b">17.73%</text>
</g>
<g transform="translate(670,0)">
<text x="150" y="48" text-anchor="middle" font-size="16" font-weight="800" fill="#e8edf5">SMOTE rebalancing</text>
<text x="150" y="68" text-anchor="middle" font-size="12" fill="#6b7f9f">Positive class share in training set</text>
<line x1="40" y1="250" x2="260" y2="250" stroke="#1e2b3f" stroke-width="2"/>
<rect class="col" style="animation-delay:0.6s" x="75" y="219" width="62" height="31" rx="6" fill="#2c3e5c"/>
<rect class="col" style="animation-delay:0.85s" x="165" y="100" width="62" height="150" rx="6" fill="#4ade80"/>
<text class="lab" style="animation-delay:1.6s" x="106" y="211" text-anchor="middle" font-size="15" font-weight="800" fill="#c9d3e8">10.3%</text>
<text class="lab" style="animation-delay:1.7999999999999998s" x="196" y="92" text-anchor="middle" font-size="15" font-weight="800" fill="#4ade80">50%</text>
</g>
<g font-size="12" fill="#6b7f9f" text-anchor="middle">
<text x="106" y="276">Others</text><text x="196" y="276">Risk group</text>
<text x="426" y="276">Other years</text><text x="516" y="276">2020</text>
<text x="746" y="276">Before</text><text x="836" y="276">After</text></g>
</g></svg>